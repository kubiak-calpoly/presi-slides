<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Pridi:wght@300;400;600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="/public/slides.css"/>
    <link rel="stylesheet" href="/public/prism-theme.css"/>
  </head>
  <body>
    <slide-presi>
        <slide-view>
            <h1 layout="title">Title Slide</h1>
        </slide-view>
        <slide-view>
            <h1>Two-column Layout</h1>
            <h3>Left side</h3>
            <ul>
                <li>One</li>
                <li>Two</li>
                <li>Three</li>
            </ul>
            <h3>Right side</h3>
            <ol>
                <li>Red</li>
                <li>Green</li>
                <li>Blue</li>
            </ol>
        </slide-view>
    </slide-presi>
    <script type="module" src="src/index.js"></script>
  </body>
</html>
